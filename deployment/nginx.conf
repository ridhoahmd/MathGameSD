server {
    listen 80;
    server_name games.videaclass.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name games.videaclass.com;

    # SSL Configuration (Replace paths with your real Certbot paths)
    # ssl_certificate /etc/letsencrypt/live/games.videaclass.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/games.videaclass.com/privkey.pem;

    # Basic SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # Important: Content-Security-Policy for sockets and internal domains
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; img-src 'self' data: blob: https:;" always;

    # Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse Proxy to PM2 Application running on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Read timeout for heavy AI calls
        proxy_read_timeout 60s;
    }

    # Websocket / Socket.io specific config
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Keep alive for websockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static file caching from express is handled by application,
    # but Nginx can serve 'public' directly for better performance (optional).
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|mp3|wav)$ {
    #     root /path/to/project/MathGameSD/public;
    #     expires 30d;
    #     add_header Cache-Control "public, no-transform";
    # }
}
