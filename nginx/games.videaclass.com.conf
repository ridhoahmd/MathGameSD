server {
    # Pastikan server_name sesuai dengan domain yang diarahkan ke IP Publik VPS Anda
    server_name games.videaclass.com;

    # Blok Logging (opsional tapi sangat berguna kalau error)
    # access_log /var/log/nginx/games.videaclass.access.log;
    # error_log /var/log/nginx/games.videaclass.error.log;

    location / {
        proxy_pass http://localhost:3000;
        
        # --- KONFIGURASI KRUSIAL SOCKET.IO --- 
        # Tanpa baris Upgrade ini, koneksi Live Score dan Real-time duel akan putus-nyambung
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Meneruskan info header user asli ke Node.js
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
