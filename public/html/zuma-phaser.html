<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Tembak Angka - Phaser Edition</title>
    <meta name="description" content="Game Tembak Angka Zuma - Tembak balon dengan angka yang tepat untuk menjawab soal matematika di Portal Videa Class" />

    <!-- CSP buat Phaser -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.googleapis.com https://*.gstatic.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://api.dicebear.com https://cdn-icons-png.flaticon.com;
        connect-src * 'unsafe-inline';
    "
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css?v=final" />
    <link rel="stylesheet" href="../css/zuma-phaser.css?v=2" />
  </head>
  <body>
    <!-- === LAYAR LOGIN === -->
    <div id="login-screen" class="login-box">
      <h2>☄️ TEMBAK ANGKA</h2>
      <p class="subtitle">Phaser Edition</p>

      <input
        type="text"
        id="username"
        placeholder="Nama Pilot"
        readonly
        class="input-readonly"
      />
      <input type="text" id="room-code" placeholder="Kode Misi (Room)" />

      <!-- Pilih Level -->
      <div class="difficulty-selector">
        <button class="btn-difficulty active" data-level="mudah">Mudah</button>
        <button class="btn-difficulty" data-level="sedang">Sedang</button>
        <button class="btn-difficulty" data-level="sulit">Sulit</button>
      </div>

      <div class="btn-login-group">
        <button class="btn-start" onclick="startGameMultiplayer()">
          🚀 MULAI MISI
        </button>
        <button class="btn-back" onclick="window.location.href = '/'">
          ⬅ BATAL
        </button>
      </div>
    </div>

    <!-- === HUD GAME (IN-GAME UI) === -->
    <div id="game-hud" style="display: none">
      <!-- Skor Kita (Kiri) -->
      <div class="hud-left">
        <div class="score-box">
          <span class="label">SKOR</span>
          <span class="value" id="score">0</span>
        </div>
      </div>

      <!-- Target Misi (Tengah) -->
      <div class="hud-center">
        <div class="target-box">
          <span class="label">TARGET</span>
          <span class="value" id="target-count">0/20</span>
        </div>
      </div>

      <!-- Skor Lawan (Kanan) -->
      <div class="hud-right">
        <div class="score-box opponent">
          <span class="label">LAWAN</span>
          <span class="value" id="opponent-score">0</span>
        </div>
        <button class="btn-exit" onclick="destroyZumaGame(); window.location.href = '/'">✖</button>
      </div>
    </div>

    <!-- === KONTAINER GAME PHASER === -->
    <div id="game-container"></div>

    <!-- === GAME OVER SCREEN === -->
    <div id="game-over-screen" class="modal hidden">
      <div class="modal-content">
        <h1>🎮 MISI SELESAI</h1>
        <p class="score-label">SKOR AKHIR</p>
        <div class="final-score" id="final-score">0</div>
        <div class="modal-buttons">
          <button class="btn-restart" onclick="restartZuma()">
            🔄 MAIN LAGI
          </button>
          <button class="btn-home" onclick="destroyZumaGame(); window.location.href = '/'">
            🏠 MENU
          </button>
        </div>
      </div>
    </div>

    <!-- === SCRIPTS === -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/audio.js?v=final"></script>
    <script src="../js/global.js"></script>
    <!-- Logic Utama Zuma -->
    <script src="../js/zuma-phaser.js?v=12"></script>
  </body>
</html>
