<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Tangkap Bintang - Videa Class</title>
    <meta name="description" content="Game Tangkap Bintang - Uji kecepatan dan ketepatan menjawab soal matematika sambil menangkap bintang di Portal Videa Class" />

    <!-- CSP biar aman, tapi tetep bolehin script yang kita butuhin -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob:;
        connect-src * 'unsafe-inline';
    "
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/base.css?v=2" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/bintang.css?v=centered" />
    <link rel="stylesheet" href="../css/visual-enhancements.css" />
    <link rel="stylesheet" href="../css/decorative-objects.css" />
    <link rel="stylesheet" href="../css/streak-effects.css" />
      <link rel="stylesheet" href="../css/game-shared.css" />
</head>

  <body>
    <!-- 🎨 DECORATIVE BACKGROUND (Week 2 Visual Polish) -->
    <div class="star-twinkle-bg">
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="twinkle-star"></div>
      <div class="comet-trail"></div>
      <div class="comet-trail"></div>
    </div>

    <!-- === LAYAR AWAL (PILAH LEVEL) === -->
    <div id="start-screen" class="modal">
      <div class="modal-content">
        <h1>🌟 TANGKAP BINTANG</h1>
        <p>Pilih Tingkat Kesulitan:</p>

        <div class="difficulty-options">
          <button
            class="btn-diff"
            data-level="mudah"
            onclick="selectDifficulty('mudah')"
          >
            😃 MUDAH
            <span class="diff-desc">Lambat, Penjumlahan</span>
          </button>
          <button
            class="btn-diff"
            data-level="sedang"
            onclick="selectDifficulty('sedang')"
          >
            😐 SEDANG
            <span class="diff-desc">Normal, Campuran (+ -)</span>
          </button>
          <button
            class="btn-diff"
            data-level="sulit"
            onclick="selectDifficulty('sulit')"
          >
            🤯 SULIT
            <span class="diff-desc">Cepat, Perkalian!</span>
          </button>
        </div>
      </div>
    </div>

    <!-- === HUD ATAS (Skor, Nyawa, Waktu) === -->
    <div class="top-bar">
      <a href="#" onclick="destroyBintangGame(); window.location.href = '/'" class="btn-back">⬅ MENU</a>

      <div id="game-hud">
        <div class="hud-item">
          <span class="hud-label">SKOR</span>
          <span class="hud-value" id="score-display">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">NYAWA</span>
          <span class="hud-value" id="lives-display">❤️❤️❤️</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">WAKTU</span>
          <span class="hud-value" id="time-display">60</span>
        </div>
      </div>
    </div>

    <!-- === TAMPILAN SOAL MTK === -->
    <div id="question-container">
      <span id="question-text">Bersiap...</span>
    </div>

    <!-- === AREA GAME PHASER (CANVAS DI SINI) === -->
    <div id="game-container"></div>

    <!-- === MODAL GAME OVER (KALO KALAH/MENANG) === -->
    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h1>🌟 PERMAINAN SELESAI 🌟</h1>
        <p>Skor Akhir Kamu:</p>
        <div class="final-score" id="final-score">0</div>
        <div class="modal-buttons">
          <button onclick="destroyBintangGame(); location.reload()" class="btn-restart">
            🔄 MAIN LAGI
          </button>
          <button onclick="destroyBintangGame(); window.location.href = '/'" class="btn-home">
            🏠 KEMBALI
          </button>
        </div>
      </div>
    </div>

    <!-- === SCRIPTS === -->
    <!-- Library Phaser buat game engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/audio.js"></script>
    <!-- Gamification System (BUG-G04 FIX: bintang.html sebelumnya tidak include ini) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="../js/gamification/achievements.js"></script>
    <script src="../js/gamification/streaks.js"></script>
    <script src="../js/gamification/leveling.js"></script>
    <!-- Logic Utama Game -->
    <script src="../js/bintang.js"></script>
  </body>
</html>
