<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏆 Top 50 Global Ranking - Videa Class</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/leaderboard.css?v=enhanced" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <div class="leaderboard-container">
      <a href="/" class="back-btn">⬅ Kembali ke Menu</a>

      <h1>🏆 TOP 50 GLOBAL RANKING 🏆</h1>

      <!-- Stats Summary -->
      <div class="leaderboard-stats">
        <div class="stat-item">
          <span class="icon">👥</span>
          <span>Total Pemain:</span>
          <span class="value" id="total-players">-</span>
        </div>
        <div class="stat-item">
          <span class="icon">⭐</span>
          <span>Total Skor:</span>
          <span class="value" id="total-score">-</span>
        </div>
        <div class="stat-item">
          <span class="icon">🎮</span>
          <span>Hari Ini:</span>
          <span class="value" id="today-count">-</span>
        </div>
      </div>

      <table class="rank-table">
        <thead>
          <tr>
            <th width="10%">Rank</th>
            <th>Pemain</th>
            <th class="th-right" width="25%">Total Skor</th>
          </tr>
        </thead>
        <tbody id="rank-list">
          <tr>
            <td colspan="3">
              <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Memuat data ranking...</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Footer -->
      <div class="leaderboard-footer">
        <button class="refresh-btn" onclick="refreshLeaderboard()">
          🔄 Refresh Data
        </button>
        <p class="update-time">
          Terakhir diperbarui: <span id="last-update">-</span>
        </p>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();
      const rankList = document.getElementById("rank-list");
      let maxScore = 0;

      // Request data
      function refreshLeaderboard() {
        rankList.innerHTML = `
          <tr>
            <td colspan="3">
              <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Memuat data ranking...</p>
              </div>
            </td>
          </tr>
        `;
        socket.emit("mintaLeaderboard");
      }

      // Initial load
      socket.emit("mintaLeaderboard");

      // Handle response
      socket.on("updateLeaderboard", (players) => {
        rankList.innerHTML = "";

        if (!players || players.length === 0) {
          rankList.innerHTML = `
            <tr>
              <td colspan="3">
                <div class="empty-msg">
                  <span class="icon">📭</span>
                  <p>Belum ada data pemain.</p>
                </div>
              </td>
            </tr>
          `;
          return;
        }

        // ✅ LIMIT TO TOP 50
        const top50 = players.slice(0, 50);

        // Calculate stats
        maxScore = top50[0]?.skor || top50[0]?.totalScore || 1;
        const totalScore = top50.reduce(
          (sum, p) => sum + (p.skor || p.totalScore || 0),
          0,
        );

        // Update stats display
        document.getElementById("total-players").textContent = top50.length;
        document.getElementById("total-score").textContent =
          totalScore.toLocaleString();
        document.getElementById("today-count").textContent = "Top 50";
        document.getElementById("last-update").textContent =
          new Date().toLocaleTimeString("id-ID");

        // Render rows
        top50.forEach((player, index) => {
          const rank = index + 1;
          const score = player.skor || player.totalScore || 0;
          const koin = player.koin || 0;
          const role = player.role || "siswa";
          const scorePercent = (score / maxScore) * 100;

          // Determine row class
          let rowClass = "row-highlight";
          if (rank === 1) rowClass += " row-rank-1";
          else if (rank === 2) rowClass += " row-rank-2";
          else if (rank === 3) rowClass += " row-rank-3";
          else if (rank <= 10) rowClass += " row-top10";

          // Determine rank display
          let rankDisplay = "";
          let rankClass = "rank-cell";
          if (rank === 1) {
            rankDisplay = "🥇";
            rankClass += " rank-1";
          } else if (rank === 2) {
            rankDisplay = "🥈";
            rankClass += " rank-2";
          } else if (rank === 3) {
            rankDisplay = "🥉";
            rankClass += " rank-3";
          } else {
            rankDisplay = `<span class="rank-number">${rank}</span>`;
          }

          // Determine role styling
          let roleClass = "player-role";
          let roleIcon = "🎓";
          if (role === "guru") {
            roleClass += " guru";
            roleIcon = "👨‍🏫";
          } else if (role === "admin") {
            roleClass += " admin";
            roleIcon = "⚙️";
          }

          const row = `
            <tr class="${rowClass}">
              <td class="${rankClass}">${rankDisplay}</td>
              <td>
                <div class="player-info">
                  <img 
                    src="https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(player.nama)}" 
                    class="mini-avatar" 
                    alt="Avatar"
                    loading="lazy"
                  >
                  <span class="player-name">
                    ${escapeHtml(player.nama)}
                    <span class="${roleClass}">${roleIcon} ${capitalizeFirst(role)}</span>
                  </span>
                </div>
              </td>
              <td class="total-score">
                <div class="score-main">${score.toLocaleString()}</div>
                <div class="score-coins">🪙 ${koin.toLocaleString()} Koin</div>
                <div class="score-bar-container">
                  <div class="score-bar" style="width: ${scorePercent}%"></div>
                </div>
              </td>
            </tr>
          `;
          rankList.innerHTML += row;
        });
      });

      // Helper functions
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function capitalizeFirst(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }
    </script>
  </body>
</html>
