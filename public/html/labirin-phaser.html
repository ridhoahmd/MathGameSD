<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Labirin Ilmu - Phaser Edition</title>

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.googleapis.com https://*.gstatic.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://api.dicebear.com https://cdn-icons-png.flaticon.com;
        connect-src * 'unsafe-inline';
    "
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css?v=final" />
    <link rel="stylesheet" href="../css/labirin-phaser.css?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <header class="game-header">
      <a href="#" onclick="destroyLabirinGame(); window.location.href = '/'" class="btn-back">⬅ MENU</a>
      <h1 class="game-title">🌀 LABIRIN ILMU</h1>
      <div class="score-box">SKOR: <span id="score">0</span></div>
    </header>

    <div id="versus-container">
      <div
        id="game-container-p1"
        style="flex: 1; min-width: 0; position: relative"
      ></div>

      <div
        id="game-container-p2"
        style="flex: 1; min-width: 0; position: relative; display: none"
      ></div>
    </div>

    <footer class="game-controls">
      <!-- Player 1 D-Pad (Left) -->
      <div class="d-pad d-pad-p1">
        <button class="btn-ctrl btn-up-p1">▲</button>
        <button class="btn-ctrl btn-left-p1">◀</button>
        <button class="btn-ctrl btn-down-p1">▼</button>
        <button class="btn-ctrl btn-right-p1">▶</button>
      </div>

      <!-- Player 2 D-Pad (Right - Versus Only) -->
      <div class="d-pad d-pad-p2" style="display: none">
        <button class="btn-ctrl btn-up-p2">▲</button>
        <button class="btn-ctrl btn-left-p2">◀</button>
        <button class="btn-ctrl btn-down-p2">▼</button>
        <button class="btn-ctrl btn-right-p2">▶</button>
      </div>
    </footer>

    <!-- GAME OVER MODAL -->
    <div id="game-over-modal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <h1 class="modal-title" id="go-title">🏆 JUARA BARU!</h1>
        <p
          id="go-winner"
          style="font-size: 1.5rem; color: #00f2ff; margin-bottom: 20px"
        >
          Player 1 Menang!
        </p>

        <div
          class="score-summary"
          style="
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
          "
        >
          <p>Skor P1: <span id="go-score-p1" style="color: cyan">0</span></p>
          <p id="go-score-p2-container" style="display: none">
            Skor P2: <span id="go-score-p2" style="color: magenta">0</span>
          </p>
        </div>

        <button onclick="location.reload()" class="btn-start-game">
          🔄 MAIN LAGI
        </button>
        <button
          onclick="destroyLabirinGame(); window.location.href = '/'"
          class="btn-back"
          style="
            margin-top: 10px;
            background: transparent;
            border: 1px solid #aaa;
          "
        >
          🏠 MENU UTAMA
        </button>
      </div>
    </div>

    <div id="loading-screen" class="modal-overlay">
      <div class="modal-content">
        <h1 class="modal-title">🌀 LABIRIN ILMU</h1>
        <p class="subtitle">Phaser Edition</p>
        <p>Temukan jalan keluar sambil belajar!</p>

        <div class="input-group">
          <input
            type="text"
            id="inputKodeKelas"
            placeholder="Kode Kelas (Opsional)"
            class="neon-input"
          />
        </div>

        <div
          class="mode-selector"
          style="
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 50;
            position: relative;
          "
        >
          <button
            class="btn-difficulty active"
            onclick="selectMode('solo')"
            data-mode="solo"
          >
            👤 SOLO
          </button>
          <button
            class="btn-difficulty"
            onclick="selectMode('versus')"
            data-mode="versus"
          >
            ⚔️ DUEL
          </button>
        </div>

        <div class="difficulty-group">
          <p>Pilih Tingkat Kesulitan:</p>
          <div class="buttons-row">
            <button class="btn-difficulty active" data-level="mudah">
              MUDAH
            </button>
            <button class="btn-difficulty" data-level="sedang">SEDANG</button>
            <button class="btn-difficulty" data-level="sulit">SULIT</button>
          </div>
        </div>

        <button onclick="requestGame()" class="btn-start-game">
          🚀 MULAI MISI
        </button>
      </div>
    </div>

    <div id="quiz-modal" class="modal-overlay" style="display: none">
      <div class="modal-content quiz-box">
        <h2 id="quiz-title">🚧 RINTANGAN!</h2>
        <p id="q-text" class="quiz-question">...</p>
        <input
          type="text"
          id="q-input"
          placeholder="Jawaban Anda..."
          autocomplete="off"
          class="quiz-input"
        />
        <p id="quiz-feedback" class="feedback-msg"></p>
        <button onclick="checkQuiz()" class="btn-submit-answer">JAWAB</button>
        <button onclick="confirmSkipObstacle()" class="btn-skip-quiz">
          ⏭️ Lewati (-10 Poin)
        </button>
      </div>
    </div>

    <div id="tutor-overlay" class="tutor-overlay" style="display: none">
      <div class="tutor-container">
        <div class="tutor-icon">🤖</div>
        <div class="tutor-content">
          <h3 class="tutor-header">ANALISIS GURU VIDEA</h3>
          <div id="tutor-text" class="tutor-body">
            Sedang menghubungi satelit ilmu... 📡
          </div>
          <button onclick="tutupTutorLabirin()" class="btn-close-tutor">
            LANJUTKAN
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/audio.js?v=r3"></script>
    <script src="../js/global.js"></script>
    <script src="../js/labirin-phaser.js?v=versusdb"></script>
  </body>
</html>
