<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Labirin Ilmu - Phaser Edition</title>

    <!-- CSP Config yang aman buat Phaser -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://*.googleapis.com https://*.gstatic.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://api.dicebear.com https://cdn-icons-png.flaticon.com;
        connect-src * 'unsafe-inline';
    "
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css?v=final" />
    <link rel="stylesheet" href="../css/labirin-phaser.css?v=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <!-- === HEADER === -->
    <header class="game-header">
      <a href="/" class="btn-back">⬅ MENU</a>
      <h1 class="game-title">🌀 LABIRIN ILMU</h1>
      <div class="score-box">SKOR: <span id="score">0</span></div>
    </header>

    <!-- === ARENA LABIRIN (CANVAS PHASER) === -->
    <!-- Di sini game Phaser bakal dirender -->
    <div id="game-container"></div>

    <!-- === KONTROL D-PAD (MOBILE ONLY) === -->
    <!-- Tombol panah buat main di HP -->
    <footer class="game-controls">
      <div class="d-pad">
        <button class="btn-ctrl btn-up">▲</button>
        <button class="btn-ctrl btn-left">◀</button>
        <button class="btn-ctrl btn-down">▼</button>
        <button class="btn-ctrl btn-right">▶</button>
      </div>
    </footer>

    <!-- === LAYAR LOADING / START SCREEN === -->
    <div id="loading-screen" class="modal-overlay">
      <div class="modal-content">
        <h1 class="modal-title">🌀 LABIRIN ILMU</h1>
        <p class="subtitle">Phaser Edition</p>
        <p>Temukan jalan keluar sambil belajar!</p>

        <!-- Input Kode Kelas (Opsional) -->
        <div class="input-group">
          <input
            type="text"
            id="inputKodeKelas"
            placeholder="Kode Kelas (Opsional)"
            class="neon-input"
          />
        </div>

        <!-- Pilihan Kesulitan -->
        <div class="difficulty-group">
          <p>Pilih Tingkat Kesulitan:</p>
          <div class="buttons-row">
            <button class="btn-difficulty active" data-level="mudah">
              MUDAH
            </button>
            <button class="btn-difficulty" data-level="sedang">SEDANG</button>
            <button class="btn-difficulty" data-level="sulit">SULIT</button>
          </div>
        </div>

        <button onclick="requestGame()" class="btn-start-game">
          🚀 MULAI MISI
        </button>
      </div>
    </div>

    <!-- === MODAL KUIS / RINTANGAN === -->
    <!-- Muncul kalau nabrak musuh atau item kuis -->
    <div id="quiz-modal" class="modal-overlay" style="display: none">
      <div class="modal-content quiz-box">
        <h2 id="quiz-title">🚧 RINTANGAN!</h2>
        <p id="q-text" class="quiz-question">...</p>
        <input
          type="text"
          id="q-input"
          placeholder="Jawaban Anda..."
          autocomplete="off"
          class="quiz-input"
        />
        <button onclick="checkQuiz()" class="btn-submit-answer">JAWAB</button>
        <button onclick="confirmSkipObstacle()" class="btn-skip-quiz">
          ⏭️ Lewati (-10 Poin)
        </button>
      </div>
    </div>

    <!-- === TUTOR AI OVERLAY === -->
    <!-- Muncul pas salah jawab kuis -->
    <div id="tutor-overlay" class="tutor-overlay" style="display: none">
      <div class="tutor-container">
        <div class="tutor-icon">🤖</div>
        <div class="tutor-content">
          <h3 class="tutor-header">ANALISIS GURU VIDEA</h3>
          <div id="tutor-text" class="tutor-body">
            Sedang menghubungi satelit ilmu... 📡
          </div>
          <button onclick="tutupTutorLabirin()" class="btn-close-tutor">
            LANJUTKAN
          </button>
        </div>
      </div>
    </div>

    <!-- === SCRIPTS === -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/audio.js?v=r3"></script>
    <script src="../js/global.js"></script>
    <script src="../js/labirin-phaser.js?v=1"></script>
  </body>
</html>
