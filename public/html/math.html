<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Battle SD</title>
    <meta name="description" content="Math Battle SD - Game pertarungan soal matematika berbasis AI untuk siswa SD di Portal Videa Class" />

    <!-- CSP Biar aman -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://api.dicebear.com https://cdn-icons-png.flaticon.com;
        connect-src * 'unsafe-inline';
    "
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Styles khusus Math Game -->
    <link rel="stylesheet" href="../css/base.css?v=2" />
    <link rel="stylesheet" href="../css/variables.css?v=2" />
    <link rel="stylesheet" href="../css/math.css?v=2" />
    <link rel="stylesheet" href="../css/visual-enhancements.css" />
    <link rel="stylesheet" href="../css/decorative-objects.css" />
    <link rel="stylesheet" href="../css/streak-effects.css" />
  </head>

  <body>
    <!-- 🎨 DECORATIVE BACKGROUND (Week 2 Visual Polish) -->
    <div class="math-background-decor">
      <div class="floating-number">7</div>
      <div class="floating-number">+</div>
      <div class="floating-number">42</div>
      <div class="floating-number">×</div>
      <div class="floating-number">9</div>
      <div class="floating-number">=</div>
      <div class="rocket-particle"></div>
      <div class="rocket-particle"></div>
      <div class="rocket-particle"></div>
    </div>

    <a href="/" class="btn-back">⬅ MENU</a>

    <div class="container">
      <!-- === LAYAR LOGIN / LOBBY === -->
      <div id="login-screen" class="screen">
        <h1>MATH BATTLE</h1>
        <p class="login-subtitle">Masuk ke arena pertempuran!</p>

        <input
          type="text"
          id="username"
          placeholder="Nama Petarung"
          readonly
          class="input-readonly"
        />
        <input
          type="text"
          id="room-code"
          placeholder="Kode Arena (Kosongkan utk Latihan)"
        />

        <!-- Pilihan Level -->
        <div class="difficulty-selector">
          <button class="btn-difficulty active" data-level="mudah">
            Mudah
          </button>
          <button class="btn-difficulty" data-level="sedang">Sedang</button>
          <button class="btn-difficulty" data-level="sulit">Sulit</button>
        </div>

        <button class="btn-action btn-start">MULAI PERTEMPURAN 🚀</button>
      </div>

      <!-- === LAYAR PERMAINAN (BATTLE) === -->
      <div id="game-screen" class="screen hidden">
        <!-- Skor Pemain vs Lawan -->
        <div class="score-box">
          <div class="score-item">
            KAMU<span id="score" class="score-val score-green">0</span>
          </div>
          <div class="score-item">
            LAWAN<span id="opponent-score" class="score-val score-red">0</span>
          </div>
        </div>

        <div id="status-display" class="status-text"></div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div id="progress-bar" class="progress-fill"></div>
        </div>

        <p class="target-text">
          Target: <span id="q-current">0</span> / <span id="q-total">∞</span>
        </p>

        <!-- Soal Matematika -->
        <h2 id="question-display">Loading...</h2>

        <input
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          id="answer-input"
          placeholder="Ketik Jawaban..."
          autocomplete="off"
        />
        <button class="btn-action" id="action-btn">TEMBAK JAWABAN 🔥</button>

        <hr class="separator" />

        <button id="btn-finish" class="btn-action btn-finish">
          🏆 SELESAI & SIMPAN SKOR
        </button>
      </div>
    </div>

    <!-- === LAYAR GAME OVER (SELESAI) === -->
    <div id="game-over-screen">
      <div class="go-content">
        <h1 class="go-title">GAME OVER</h1>
        <p class="go-label">Skor Akhir Kamu</p>

        <div class="go-score">
          <span id="final-score">0</span>
        </div>

        <button onclick="restartGame()" class="btn-action btn-retry">
          MAIN LAGI
        </button>

        <button onclick="window.location.href = '/'" class="btn-home">
          KEMBALI KE MENU
        </button>
      </div>
    </div>

    <!-- === SCRIPTS === -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="../js/audio.js?v=final"></script>
    <script src="../js/global.js"></script>
    <!-- === SISTEM GAMIFIKASI === -->
    <script src="../js/gamification/achievements.js"></script>
    <script src="../js/gamification/streaks.js"></script>
    <script src="../js/gamification/leveling.js"></script>
    <!-- Particle Effects System (Phase 4) -->
    <script src="../js/utils/particleEffects.js"></script>
    <script src="../js/utils/comboManager.js"></script>
    <!-- Logic Game Modul -->
    <script type="module" src="../js/game.js?v=Refactored"></script>
  </body>
</html>
