<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilah Hukum Tajwid - Videa Class</title>

    <!-- Font Arab yang enak dibaca (Amiri) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css?v=fix_ui_1" />
    <link rel="stylesheet" href="../css/tajwid.css?v=fix_ui_1" />
    <link rel="stylesheet" href="../css/visual-enhancements.css" />
    <link rel="stylesheet" href="../css/streak-effects.css" />
  </head>
  <body>
    <!-- === TOP BAR === -->
    <div class="top-bar">
      <a href="/" class="btn-back">⬅ Kembali</a>
      <div class="score-badge">✨ Skor: <span id="score">0</span></div>
    </div>

    <div class="game-wrapper">
      <!-- === LAYAR START === -->
      <div id="start-screen" class="panel active glass-panel">
        <div class="game-logo">⚖️</div>
        <h1 class="title">PILAH HUKUM</h1>
        <p class="desc">Geser kartu Arab ke keranjang hukum yang benar!</p>

        <div class="difficulty-label">Pilih Tingkat Kesulitan:</div>
        <div class="difficulty-selector">
          <button class="btn-diff active" data-level="mudah">Mudah</button>
          <button class="btn-diff" data-level="sedang">Sedang</button>
          <button class="btn-diff" data-level="sulit">Sulit</button>
        </div>

        <button onclick="startGame()" class="btn-start">MULAI MAIN</button>
      </div>

      <!-- === LAYAR MAIN (SORTIR KARTU) === -->
      <div id="game-screen" class="panel hidden">
        <!-- Hint Button -->
        <button id="hint-btn" class="hint-button" onclick="useHint()">
          💡 Petunjuk <span id="hint-count">2/2</span>
        </button>

        <!-- Area Keranjang (Kiri/Kanan) -->
        <div class="buckets-area">
          <div
            class="bucket left-bucket"
            id="btn-kiri"
            onclick="handleInput('kiri')"
          >
            <div class="bucket-icon">⬅</div>
            <div class="bucket-name" id="label-left">KIRI</div>
          </div>
          <div
            class="bucket right-bucket"
            id="btn-kanan"
            onclick="handleInput('kanan')"
          >
            <div class="bucket-icon">➡</div>
            <div class="bucket-name" id="label-right">KANAN</div>
          </div>
        </div>

        <!-- Kartu Soal (Bisa digeser/drag) -->
        <div class="card-container">
          <div id="card" class="flashcard">
            <span id="arabic-text">...</span>
          </div>
          <div class="drag-hint">Geser (HP) atau Tekan Panah (PC)</div>
        </div>

        <!-- Feedback Visual (Benar/Salah) -->
        <div id="feedback-overlay"></div>
      </div>

      <!-- === LAYAR HASIL === -->
      <div id="result-screen" class="panel hidden glass-panel">
        <h2
          style="
            font-family: &quot;Orbitron&quot;;
            color: #00f2ff;
            margin-bottom: 20px;
          "
        >
          WAKTU HABIS!
        </h2>
        <div class="final-score-box" style="margin-bottom: 30px">
          <p style="color: #aaa; margin: 0">Total Skor</p>
          <h1
            id="final-score"
            style="font-size: 4rem; margin: 0; color: #ffd700"
          >
            0
          </h1>
        </div>
        <div class="action-buttons">
          <button onclick="location.reload()" class="btn-retry">
            MAIN LAGI
          </button>
          <button onclick="window.location.href = '/'" class="btn-home">
            MENU UTAMA
          </button>
        </div>
      </div>
    </div>

    <!-- === TUTOR AI OVERLAY === -->
    <div id="tutor-overlay" class="tutor-overlay">
      <div class="tutor-icon">🤖</div>
      <div class="tutor-box">
        <h2 class="tutor-title">Guru Videa Menjelaskan</h2>
        <hr class="tutor-divider" />
        <p id="tutor-text" class="tutor-text">
          Sedang menganalisis kesalahanmu... 📖
        </p>
        <button onclick="tutupTutor()" class="btn-tutor-close">
          SAYA PAHAM! 👍
        </button>
      </div>
    </div>

    <!-- === SCRIPTS === -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/audio.js?v=fix_ui_1"></script>
    <script src="../js/global.js"></script>
    <!-- Sistem Gamifikasi -->
    <script src="../js/gamification/achievements.js"></script>
    <script src="../js/gamification/streaks.js"></script>
    <script src="../js/gamification/leveling.js"></script>
    <script src="../js/utils/comboManager.js"></script>
    <!-- NEW: Optimizations -->
    <script src="../js/utils/particleEffects.js"></script>
    <script src="../js/utils/hintSystem.js"></script>
    <script src="../js/tajwid.js?v=fix_ui_1"></script>
  </body>
</html>
