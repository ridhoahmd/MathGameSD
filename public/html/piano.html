<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano Speed - Videa Class</title>

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';
        connect-src * 'unsafe-inline';
        img-src 'self' data: https: blob:;
      "
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css?v=final" />
    <link rel="stylesheet" href="../css/piano.css?v=final" />
  </head>

  <body oncontextmenu="return false;">
    <a href="/" class="btn-back">⬅ Menu</a>

    <div class="hud">
      <div class="score-box">Skor: <span id="score">0</span></div>
      <div class="timer-box">⏳ <span id="timer">60</span>s</div>
    </div>

    <div class="question-box" id="question">PILIH LEVEL & MULAI</div>

    <div class="controls-area" id="start-controls">
      <div class="difficulty-selector">
        <button class="btn-level active" data-level="mudah">
          Mudah (3 Nada)
        </button>
        <button class="btn-level" data-level="sedang">Sedang (5 Nada)</button>
        <button class="btn-level" data-level="sulit">Sulit (7 Nada)</button>
      </div>
      <button onclick="startGameSession()" class="btn-start">MULAI 🎵</button>
    </div>

    <div class="piano-container">
      <button
        class="key"
        data-val="1"
        ontouchstart="event.preventDefault(); playNote(1)"
        onclick="playNote(1)"
      >
        1
      </button>
      <button
        class="key"
        data-val="2"
        ontouchstart="event.preventDefault(); playNote(2)"
        onclick="playNote(2)"
      >
        2
      </button>
      <button
        class="key"
        data-val="3"
        ontouchstart="event.preventDefault(); playNote(3)"
        onclick="playNote(3)"
      >
        3
      </button>
      <button
        class="key"
        data-val="4"
        ontouchstart="event.preventDefault(); playNote(4)"
        onclick="playNote(4)"
      >
        4
      </button>
      <button
        class="key"
        data-val="5"
        ontouchstart="event.preventDefault(); playNote(5)"
        onclick="playNote(5)"
      >
        5
      </button>
      <button
        class="key"
        data-val="6"
        ontouchstart="event.preventDefault(); playNote(6)"
        onclick="playNote(6)"
      >
        6
      </button>
      <button
        class="key"
        data-val="7"
        ontouchstart="event.preventDefault(); playNote(7)"
        onclick="playNote(7)"
      >
        7
      </button>
      <button
        class="key"
        data-val="8"
        ontouchstart="event.preventDefault(); playNote(8)"
        onclick="playNote(8)"
      >
        8
      </button>
      <button
        class="key"
        data-val="9"
        ontouchstart="event.preventDefault(); playNote(9)"
        onclick="playNote(9)"
      >
        9
      </button>
      <button
        class="key"
        data-val="0"
        ontouchstart="event.preventDefault(); playNote(0)"
        onclick="playNote(0)"
      >
        0
      </button>
    </div>

    <div class="modal" id="game-over-modal">
      <div class="modal-content">
        <h1 class="modal-title">WAKTU HABIS!</h1>
        <p class="modal-label">Skor Akhir:</p>
        <h2 class="modal-score" id="final-score">0</h2>

        <button onclick="location.reload()" class="btn-start">MAIN LAGI</button>

        <button onclick="window.location.href='/'" class="btn-secondary">
          KEMBALI
        </button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/piano.js?v=final"></script>
  </body>
</html>
