<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labirin Ilmu - Videa Class</title>

    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://api.dicebear.com https://cdn-icons-png.flaticon.com;
        connect-src * 'unsafe-inline';
    "
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css?v=final" />
    <link rel="stylesheet" href="../css/labirin.css?v=final" />
    <link rel="stylesheet" href="../css/visual-enhancements.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <!-- CONTAINER UTAMA (FLEX COLUMN) -->
    <div id="app-container">
      <!-- HEADER: Tombol Back & Skor -->
      <header class="game-header">
        <a href="/" class="btn-back">⬅ MENU</a>
        <h1 class="game-title-small">LABIRIN MATH</h1>
        <div class="score-box">SKOR: <span id="score">0</span></div>
      </header>

      <!-- MAIN AREA: Canvas Game -->
      <main class="game-main">
        <canvas id="mazeCanvas"></canvas>
      </main>

      <!-- FOOTER: Controls (Akan muncul di mobile) -->
      <footer class="game-controls">
        <div class="d-pad">
          <button class="btn-ctrl btn-up">▲</button>
          <button class="btn-ctrl btn-left">◀</button>
          <button class="btn-ctrl btn-down">▼</button>
          <button class="btn-ctrl btn-right">▶</button>
        </div>
      </footer>
    </div>

    <!-- OVERLAYS (MODALS) -->

    <!-- 1. LOADING / START SCREEN -->
    <div id="loading-screen" class="modal-overlay">
      <div class="modal-content neon-box">
        <h1 class="neon-title">LABIRIN ILMU</h1>
        <p>Temukan jalan keluar sambil belajar!</p>

        <div class="input-group">
          <input
            type="text"
            id="inputKodeKelas"
            placeholder="Kode Kelas (Opsional)"
            class="neon-input"
          />
        </div>

        <div class="difficulty-group">
          <p>Pilih Tingkat Kesulitan:</p>
          <div class="buttons-row">
            <button class="btn-level active" data-level="mudah">MUDAH</button>
            <button class="btn-level" data-level="sedang">SEDANG</button>
            <button class="btn-level" data-level="sulit">SULIT</button>
          </div>
        </div>

        <button onclick="requestGame()" class="btn-start-game">
          🚀 MULAI MISI
        </button>
      </div>
    </div>

    <!-- 2. QUIZ MODAL -->
    <div id="quiz-modal" class="modal-overlay" style="display: none">
      <div class="modal-content quiz-box">
        <h2 id="quiz-title">🚧 RINTANGAN!</h2>
        <p id="q-text" class="quiz-question">...</p>
        <input
          type="text"
          id="q-input"
          placeholder="Jawaban Anda..."
          autocomplete="off"
          class="quiz-input"
        />
        <button onclick="checkQuiz()" class="btn-submit-answer">JAWAB</button>
      </div>
    </div>

    <!-- 3. AI TUTOR OVERLAY -->
    <div id="tutor-overlay" class="tutor-overlay">
      <div class="tutor-container">
        <div class="tutor-icon">🤖</div>
        <div class="tutor-content">
          <h3 class="tutor-header">ANALISIS GURU VIDEA</h3>
          <div id="tutor-text" class="tutor-body">
            Sedang menghubungi satelit ilmu... 📡
          </div>
          <button onclick="tutupTutorLabirin()" class="btn-close-tutor">
            LANJUTKAN
          </button>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/audio.js?v=r3"></script>
    <script src="../js/global.js"></script>
    <!-- Gamification Systems -->
    <script src="../js/gamification/achievements.js"></script>
    <script src="../js/gamification/streaks.js"></script>
    <script src="../js/gamification/leveling.js"></script>
    <script src="../js/labirin.js?v=r3"></script>
  </body>
</html>
