<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sambung Ayat - Videa Class</title>

    <!-- CSP Biar aman dr serangan XSS, tapi tetep bolehin script internal -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval';
        font-src 'self' https://fonts.gstatic.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    "
    />

    <!-- Font Arab yang cantik (Amiri) & Font Modern (Poppins) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Ambil style global & style khusus game ini -->
    <link rel="stylesheet" href="../css/style.css?v=final" />
    <link rel="stylesheet" href="../css/ayat.css?v=final" />
    <link rel="stylesheet" href="../css/visual-enhancements.css" />
  </head>
  <body>
    <!-- === TOP BAR === -->
    <!-- Tombol balik & indikator level -->
    <div class="top-bar">
      <a href="/" class="btn-back">⬅ Kembali</a>
      <div class="level-badge">
        Juz Amma - <span id="difficulty-display">Mudah</span>
      </div>
    </div>

    <!-- === AREA UTAMA GAME === -->
    <div class="game-container">
      <div class="game-header">
        <h1 class="title-islamic">SAMBUNG AYAT</h1>
        <div class="stats-row">
          <div class="stat-box">✨ Skor: <span id="score">0</span></div>
          <div class="stat-box">⏳ Waktu: <span id="timer">00</span></div>
        </div>
      </div>

      <!-- 1. Layar Awal (Milih Level) -->
      <div id="start-screen" class="panel active">
        <div class="icon-big">📖</div>
        <p class="intro-text">"Bacalah dengan (menyebut) nama Tuhanmu..."</p>
        <p class="sub-text">Lanjutkan potongan ayat berikut ini.</p>

        <!-- Pilihan Tingkat Kesulitan -->
        <div class="difficulty-selector">
          <button class="btn-diff active" data-level="mudah">Mudah</button>
          <button class="btn-diff" data-level="sedang">Sedang</button>
          <button class="btn-diff" data-level="sulit">Sulit</button>
        </div>

        <button onclick="startGame()" class="btn-start">MULAI TAHFIDZ</button>
      </div>

      <!-- 2. Layar Gameplay (Soal & Jawaban) -->
      <div id="game-screen" class="panel hidden">
        <!-- ENDLESS MODE: Save Button -->
        <button
          id="btn-save-exit"
          class="btn-save-exit"
          onclick="saveAndExit()"
        >
          💾 SIMPAN & SELESAI
        </button>

        <!-- Progress Bar (biar tau udah nomer berapa) -->
        <div class="progress-bar">
          <div class="progress-fill" id="progress"></div>
        </div>

        <!-- Kartu Soal -->
        <div class="question-card">
          <div class="q-number">
            Pertanyaan <span id="q-current">1</span>/<span id="q-total">5</span>
          </div>

          <!-- Potongan Ayat (Arab) -->
          <h2 id="question-text" class="arabic-text">...</h2>

          <!-- Tombol bantuan buat liat bacaan latin -->
          <button onclick="toggleLatin()" class="btn-toggle-latin">
            👁️ Lihat Bantuan Latin
          </button>

          <!-- Teks Latin (Default sembunyi) -->
          <p id="latin-text">...</p>
        </div>

        <!-- Pilihan Jawaban (A, B, C, D) -->
        <div class="options-grid" id="options-container"></div>
      </div>

      <!-- 3. Layar Hasil (Selesai) -->
      <div id="result-screen" class="panel hidden">
        <h2>ALHAMDULILLAH</h2>
        <div class="final-score-box">
          <span>Total Hafalan</span>
          <h1 id="final-score">0</h1>
        </div>
        <p id="result-msg">Barakallah Fiik!</p>

        <button onclick="location.reload()" class="btn-retry">
          ULANGI LAGI
        </button>
        <button onclick="window.location.href = '/'" class="btn-home">
          KEMBALI KE MENU
        </button>
      </div>
    </div>

    <!-- === TUTOR AI OVERLAY === -->
    <!-- Muncul kalau salah jawab, ngasih penjelasan -->
    <div id="tutor-overlay" class="tutor-overlay">
      <div class="tutor-icon">🤖</div>
      <div class="tutor-box">
        <h2 class="tutor-title">Guru Videa Menjelaskan</h2>
        <hr class="tutor-divider" />
        <p id="tutor-text" class="tutor-text">Sedang menganalisis ayat... 📖</p>
        <button onclick="tutupTutor()" class="btn-tutor-close">
          SAYA PAHAM! 👍
        </button>
      </div>
    </div>

    <!-- === SCRIPTS === -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/audio.js?v=final"></script>
    <script src="../js/global.js"></script>
    <!-- Sistem Gamifikasi (Combo, Level, dll) -->
    <script src="../js/gamification/achievements.js"></script>
    <script src="../js/gamification/streaks.js"></script>
    <script src="../js/gamification/leveling.js"></script>
    <script src="../js/utils/comboManager.js"></script>

    <!-- Logic Game Sambung Ayat -->
    <script src="../js/ayat.js?v=final"></script>
  </body>
</html>
